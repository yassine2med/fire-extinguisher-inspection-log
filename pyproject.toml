[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fire-extinguisher-inspection-log"
version = "0.1.0"
description = "Monthly fire extinguisher inspection log with overdue alerts in SQLite"
requires-python = ">=3.10"
dependencies = []
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
